name: Deople Screenshot

on:
  # 保留原来的每日 UTC 03:00（北京时间 11:00）计划
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 防止同一个截图工作流重叠领取相同网站
concurrency:
  group: deople-screenshot
  cancel-in-progress: false

jobs:
  screenshot:
    name: Capture Website Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}

      R2_BUCKET: deople-images
      IMAGE_BASE_URL: https://img.deople.ai

      # 每批最多100条；最多5批，单次最多领取500条
      SCREENSHOT_BATCH_SIZE: "100"
      SCREENSHOT_MAX_BATCHES: "5"
      SCREENSHOT_WORKERS: "3"

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check screenshot.py
        run: |
          python -m py_compile screenshot.py
          echo "screenshot.py syntax check passed"

      - name: Run screenshot
        run: python -u screenshot.py
