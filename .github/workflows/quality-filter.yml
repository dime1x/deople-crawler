
name: Deople Quality Filter

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: "0 2 * * *"

  # 支持手动运行
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deople-quality-filter
  cancel-in-progress: false

jobs:
  quality-filter:
    name: Filter All Pending Websites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. 获取 GitHub 仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行质量筛选
      - name: Run Quality Filter
        run: python -u quality_filter.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

          # 每批检查100个，程序自动循环处理全部待筛选网站
          QUALITY_BATCH_SIZE: "100"
