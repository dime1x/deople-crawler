
name: Deople Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: deople-collector
  cancel-in-progress: true

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Test D1 database connection
    run: python -u database.py
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  - name: Run collector
    run: python -u collector.py
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CERTSTREAM_API_KEY: ${{ secrets.CERTSTREAM_API_KEY }}
        run: |
          python -u collector.py
